<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Proyectos Nodo Sur</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="barra">
      <img class="logo" src="images/logo.svg" alt="Logotipo de Nodo Sur Soluciones Digitales">
      <p class="lema">Proyectos Nodo Sur</p>
    </div>
  </header>

  <main class="container container-login">
    <h1>Acceso al sistema</h1>
    <p class="intro">Inicia sesión para crear y administrar proyectos. La consulta del listado es pública.</p>

    <div class="pestanas" role="group" aria-label="Elegir acción">
      <button type="button" class="filtro activo" id="tab-login" aria-pressed="true">Iniciar sesión</button>
      <button type="button" class="filtro" id="tab-registro" aria-pressed="false">Crear cuenta</button>
    </div>

    <form id="form-login" class="tarjeta" novalidate>
      <label for="login-correo">Correo electrónico</label>
      <input type="email" id="login-correo" name="correo" autocomplete="email" required>
      <p class="error-campo" id="err-login-correo" hidden></p>

      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      <p class="error-campo" id="err-login-password" hidden></p>

      <button type="submit" class="btn btn-ancho">Entrar</button>
    </form>

    <form id="form-registro" class="tarjeta" novalidate hidden>
      <label for="reg-nombre">Nombre</label>
      <input type="text" id="reg-nombre" name="nombre" autocomplete="name" required minlength="2" maxlength="60">
      <p class="error-campo" id="err-reg-nombre" hidden></p>

      <label for="reg-correo">Correo electrónico</label>
      <input type="email" id="reg-correo" name="correo" autocomplete="email" required>
      <p class="error-campo" id="err-reg-correo" hidden></p>

      <label for="reg-password">Contraseña (mínimo 8 caracteres)</label>
      <input type="password" id="reg-password" name="password" autocomplete="new-password" required minlength="8">
      <p class="error-campo" id="err-reg-password" hidden></p>

      <button type="submit" class="btn btn-ancho">Registrarme</button>
    </form>

    <p id="aviso" class="mensaje" role="status" aria-live="polite"></p>
    <p class="enlace-lectura"><a href="proyectos.html">Ver proyectos sin iniciar sesión</a></p>
  </main>

  <footer class="site-footer">
    <p>Nodo Sur Soluciones Digitales S.A. de C.V. | Avance del reto final</p>
  </footer>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
